<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True 3D Cinematic Shorts Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #151d2a;
            border-bottom: 1px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title h1 {
            font-size: 1.1rem;
            color: #f43f5e;
        }
        .logo-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #e11d48;
        }
        .btn-primary:hover {
            background-color: #be123c;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: #131b2e;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1rem;
            color: #f43f5e;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1e2d4a;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .scene-item {
            background-color: #0b0f19;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .scene-info {
            flex: 1;
            font-size: 0.8rem;
        }
        .scene-info strong {
            color: #f43f5e;
            display: block;
        }
        .scene-info p {
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 9/16;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e11d48;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.3);
        }
        .screen.landscape {
            max-width: 640px;
            aspect-ratio: 16/9;
        }

        #three-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .screen-ratio-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .subtitles {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fef08a;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .scene-overlay-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
            z-index: 10;
            width: 90%;
            text-align: center;
        }

        .controls {
            width: 100%;
            background-color: #131b2e;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <header>
        <div class="logo-title">
            <h1>🎬 True 3D Cinematic Shorts Studio</h1>
            <p>Real 3D Graphics, Deep Voice & Subtitles</p>
        </div>
        <div class="nav-btns">
            <button class="btn btn-primary" onclick="showTab('editor')">📝 Script Editor</button>
            <button class="btn" id="player-tab-btn" onclick="showTab('player')">▶️ Play Series 3D</button>
        </div>
    </header>

    <main>
        <!-- EDITOR SECTION -->
        <div id="tab-editor">
            <div class="grid">
                <div>
                    <div class="card">
                        <h2>Series Settings</h2>
                        <div class="form-group">
                            <label>Series Title</label>
                            <input type="text" id="series-title" value="Epic 3D Cinematic Shorts">
                        </div>
                    </div>

                    <div class="card">
                        <h2>Add 3D Scene (30+ Secs)</h2>
                        <div class="form-group">
                            <label>3D World Environment</label>
                            <select id="scene-theme">
                                <option value="space">🚀 3D Space Galaxy & Rotating Planets</option>
                                <option value="cyber">🌆 3D Cyberpunk City Grid & Neon Towers</option>
                                <option value="fantasy">🏰 3D Magical Floating Castle & Orbs</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Scene Title</label>
                            <textarea id="scene-desc" rows="2" placeholder="Scene title..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Duration in Seconds (25-30s+)</label>
                            <input type="number" id="scene-duration" value="25" min="5" max="60">
                        </div>
                        <div class="form-group">
                            <label>🔊 Deep Male Voiceover Text (English)</label>
                            <textarea id="scene-spoken-text" rows="3" placeholder="Voice text..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>💬 Subtitle Text (Shown on Screen)</label>
                            <textarea id="scene-sub-text" rows="3" placeholder="Subtitles..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>🎵 Upload Custom Audio (Optional: MP3/WAV)</label>
                            <input type="file" id="custom-audio-file" accept="audio/*">
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="addNewScene()">+ Add 3D Scene</button>
                            <button class="btn" style="background:#8b5cf6;" onclick="loadTrendingIdea()">💡 Ready 3D Story Idea</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h2 style="margin: 0;">Scenes List (<span id="scenes-count">0</span>)</h2>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeAllScenes()">Clear All</button>
                        </div>
                        <div id="scenes-list">
                            <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLAYER SECTION -->
        <div id="tab-player" class="hidden">
            <div class="player-container">
                <div style="margin-bottom: 10px; display: flex; gap: 8px;">
                    <button class="screen-ratio-btn" onclick="setAspectRatio('9/16')">📱 TikTok & Reels (9:16)</button>
                    <button class="screen-ratio-btn" onclick="setAspectRatio('16/9')">💻 YouTube Landscape (16:9)</button>
                </div>
                <div class="screen" id="main-screen">
                    <canvas id="three-canvas"></canvas>
                    <div id="scene-title-overlay" class="scene-overlay-title"></div>
                    <div id="play-sub" class="subtitles">...</div>
                </div>

                <div class="controls">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-primary" id="play-btn" onclick="togglePlay()">Play 3D ▶️</button>
                        <button class="btn" style="background:#16a34a;" id="record-btn" onclick="toggleRecord()">🔴 Record & Download</button>
                        <button class="btn" onclick="prevScene()">Prev</button>
                        <button class="btn" onclick="nextScene()">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let scenes = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let currentAudioPlayer = null;

        // Three.js 3D Variables
        let scene3D, camera3D, renderer3D, anim3DId;
        let meshGroup = new THREE.Group();

        const trendingIdeas = [
            {
                theme: "cyber",
                desc: "The Cyberpunk Neon Grid Chase",
                duration: 25,
                spokenText: "Running for survival through the quantum cyber grid while digital neon towers rise and fall in a dystopian world.",
                subText: "Running for survival through the neon grid..."
            },
            {
                theme: "space",
                desc: "Deep Space Wormhole Warp",
                duration: 25,
                spokenText: "Traveling at superluminal speed across rotating 3D planets and infinite starfields into an alternate dimension.",
                subText: "Wormhole jump initiated. Entering galaxy X..."
            },
            {
                theme: "fantasy",
                desc: "The Magical Floating Citadel",
                duration: 25,
                spokenText: "High above the clouds, ancient magical structures and floating crystal spheres reveal the secrets of destiny.",
                subText: "Unlocking ancient magical 3D secrets..."
            }
        ];

        window.onload = function() {
            init3DEngine();
            loadTrendingIdea();
        };

        function init3DEngine() {
            const canvas = document.getElementById('three-canvas');
            renderer3D = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer3D.setSize(380, 675);
            renderer3D.setPixelRatio(window.devicePixelRatio);

            scene3D = new THREE.Scene();
            camera3D = new THREE.PerspectiveCamera(60, 380 / 675, 0.1, 1000);
            camera3D.position.z = 12;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene3D.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xf43f5e, 2);
            dirLight.position.set(5, 10, 7);
            scene3D.add(dirLight);

            scene3D.add(meshGroup);
        }

        function build3DWorld(theme) {
            while(meshGroup.children.length > 0) {
                meshGroup.remove(meshGroup.children[0]);
            }

            if (theme === 'space') {
                scene3D.background = new THREE.Color(0x020617);
                const planetGeo = new THREE.SphereGeometry(3, 32, 32);
                const planetMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.3, metalness: 0.4 });
                const planet = new THREE.Mesh(planetGeo, planetMat);
                meshGroup.add(planet);

                const ringGeo = new THREE.RingGeometry(4.2, 5.8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 3;
                planet.add(ring);

            } else if (theme === 'cyber') {
                scene3D.background = new THREE.Color(0x09090b);
                for(let i = -3; i <= 3; i += 1.8) {
                    const bGeo = new THREE.BoxGeometry(1.2, Math.random() * 7 + 3, 1.2);
                    const bMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, wireframe: true });
                    const b = new THREE.Mesh(bGeo, bMat);
                    b.position.set(i * 1.5, -1, Math.random() * -3);
                    meshGroup.add(b);
                }

            } else if (theme === 'fantasy') {
                scene3D.background = new THREE.Color(0x2e1065);
                const castleGeo = new THREE.BoxGeometry(2.5, 3.5, 2.5);
                const castleMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2, metalness: 0.8 });
                const castle = new THREE.Mesh(castleGeo, castleMat);
                meshGroup.add(castle);

                for(let i = 0; i < 5; i++) {
                    const orbGeo = new THREE.SphereGeometry(0.35, 16, 16);
                    const orbMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x8b5cf6 });
                    const orb = new THREE.Mesh(orbGeo, orbMat);
                    orb.position.set(Math.sin(i)*3.5, Math.cos(i)*2, Math.sin(i*2)*2);
                    meshGroup.add(orb);
                }
            }
        }

        function animate3D() {
            if (!isPlaying) return;
            anim3DId = requestAnimationFrame(animate3D);

            meshGroup.rotation.y += 0.01;
            meshGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.15;
            camera3D.position.z = 10 + Math.sin(Date.now() * 0.0015) * 1.5;

            renderer3D.render(scene3D, camera3D);
        }

        function loadTrendingIdea() {
            const random = trendingIdeas[Math.floor(Math.random() * trendingIdeas.length)];
            document.getElementById('scene-theme').value = random.theme;
            document.getElementById('scene-desc').value = random.desc;
            document.getElementById('scene-duration').value = random.duration;
            document.getElementById('scene-spoken-text').value = random.spokenText;
            document.getElementById('scene-sub-text').value = random.subText;
        }

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const spokenText = document.getElementById('scene-spoken-text').value.trim();
            const subText = document.getElementById('scene-sub-text').value.trim();
            const theme = document.getElementById('scene-theme').value;
            const duration = parseInt(document.getElementById('scene-duration').value) || 25;
            const audioInput = document.getElementById('custom-audio-file');
            
            let audioUrl = null;
            if (audioInput.files && audioInput.files[0]) {
                audioUrl = URL.createObjectURL(audioInput.files[0]);
            }

            if (!desc) {
                alert("Please enter a scene description!");
                return;
            }

            scenes.push({
                desc: desc,
                spokenText: spokenText || desc,
                subText: subText || spokenText || desc,
                theme: theme,
                duration: duration,
                audioUrl: audioUrl
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-spoken-text').value = '';
            document.getElementById('scene-sub-text').value = '';
            audioInput.value = '';
            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>';
                return;
            }

            list.innerHTML = scenes.map((sc, i) => `
                <div class="scene-item">
                    <div class="scene-info">
                        <strong>3D Scene #${i + 1} (${sc.duration}s - ${sc.theme})</strong>
                        <p>${sc.desc} ${sc.audioUrl ? '🎵 (Custom Audio)' : ''}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteScene(index) {
            scenes.splice(index, 1);
            renderScenes();
        }

        function removeAllScenes() {
            scenes = [];
            renderScenes();
        }

        function setAspectRatio(ratio) {
            const screen = document.getElementById('main-screen');
            const w = ratio === '16/9' ? 640 : 380;
            const h = ratio === '16/9' ? 360 : 675;

            if (ratio === '16/9') {
                screen.classList.add('landscape');
            } else {
                screen.classList.remove('landscape');
            }

            renderer3D.setSize(w, h);
            camera3D.aspect = w / h;
            camera3D.updateProjectionMatrix();
        }

        function startMovie() {
            currentIndex = 0;
            isPlaying = true;
            document.getElementById('play-btn').innerText = "Pause ⏸️";
            runScene();
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene to play!");
                    return;
                }
                startMovie();
            }
        }

        function runScene() {
            if (!isPlaying) return;
            const sc = scenes[currentIndex];
            renderFrame();

            playTimer = setTimeout(() => {
                if (!isPlaying) return;
                if (currentIndex < scenes.length - 1) {
                    currentIndex++;
                    runScene();
                } else {
                    currentIndex = 0;
                    stopMovie();
                }
            }, sc.duration * 1000);
        }

        function renderFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];

            document.getElementById('scene-title-overlay').innerText = sc.desc;
            document.getElementById('play-sub').innerText = sc.subText;

            // Build and start Three.js 3D World for this scene
            build3DWorld(sc.theme);
            if (anim3DId) cancelAnimationFrame(anim3DId);
            animate3D();

            // Handle Audio
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }

            if (sc.audioUrl) {
                currentAudioPlayer = new Audio(sc.audioUrl);
                currentAudioPlayer.play();
            } else {
                speakDeepMale(sc.spokenText);
            }
        }

        function toggleRecord() {
            if (scenes.length === 0) {
                alert("Please add scenes before recording!");
                return;
            }
            alert("Starting 3D playback for screen recording to export to TikTok/Reels!");
            startMovie();
        }

        function stopMovie() {
            isPlaying = false;
            clearTimeout(playTimer);
            if (anim3DId) cancelAnimationFrame(anim3DId);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            document.getElementById('play-btn').innerText = "Play 3D ▶️";
        }

        function nextScene() {
            if (currentIndex < scenes.length - 1) {
                currentIndex++;
                renderFrame();
            }
        }

        function prevScene() {
            if (currentIndex > 0) {
                currentIndex--;
                renderFrame();
            }
        }

        function speakDeepMale(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 0.85;
                speech.pitch = 0.05; // Extremely Deep Low Pitch Male Voice
                
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Male') || v.name.includes('David') || v.name.includes('Mark') || v.name.includes('Google US English')));
                if (maleVoice) speech.voice = maleVoice;

                window.speechSynthesis.speak(speech);
            }
        }

        function showTab(tab) {
            const editor = document.getElementById('tab-editor');
            const player = document.getElementById('tab-player');

            if (tab === 'editor') {
                editor.classList.remove('hidden');
                player.classList.add('hidden');
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene before playing!");
                    return;
                }
                editor.classList.add('hidden');
                player.classList.remove('hidden');
                startMovie();
            }
        }
    </script>
</body>
</html>
