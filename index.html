<body>

    <header>
        <div class="logo-title">
            <h1>🎬 ستوديو المسلسلات القصيرة</h1>
            <p>صانع ومشغل القصص التفاعلي</p>
        </div>
        <div class="nav-btns">
            <button class="btn btn-primary" onclick="showTab('editor')">📝 الكتابة والسيناريو</button>
            <button class="btn" id="player-tab-btn" onclick="showTab('player')">▶️ عرض المسلسل</button>
        </div>
    </header>

    <main>
        <!-- EDITOR SECTION -->
        <div id="tab-editor">
            <div class="grid">
                <!-- Inputs -->
                <div>
                    <div class="card">
                        <h2>إعدادات القصة</h2>
                        <div class="form-group">
                            <label>عنوان الحلقة أو المسلسل</label>
                            <input type="text" id="series-title" value="قلعة الأسرار السحرية">
                        </div>
                    </div>

                    <div class="card">
                        <h2>إضافة مشهد جديد</h2>
                        <div class="form-group">
                            <label>نوع الطابع البصري للمشهد (Visual Theme)</label>
                            <select id="scene-style">
                                <option value="fantasy">🏰 قلعة وفنتازيا وسحر</option>
                                <option value="space">🚀 فضاء ومجرات واستكشاف</option>
                                <option value="cyber">🌆 مدينة مستقبلية ونيون</option>
                                <option value="nature">🌲 طبيعة وجبال وغروب</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>وصف المشهد البصري</label>
                            <textarea id="scene-desc" rows="3" placeholder="مثال: قلعة بانورامية طافية في الهواء تحيط بها الشلالات..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>مدة المشهد (بالثواني - الحد الأدنى 30ث للفيديو الكامل)</label>
                            <input type="number" id="scene-duration" value="10" min="5" max="60">

                        <div class="form-group">
                            <label>النص أو الحوار بالعربي</label>
                            <textarea id="scene-text" rows="2" placeholder="مثال: أيها المسافرون، لقد وصلتم إلى عتبة قلعة الأسرار..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>ترجمة الحوار بالإنجليزي (English narration)</label>
                            <textarea id="scene-text-en" rows="2" placeholder="Example: Travelers, you have arrived at the Castle of Secrets..."></textarea>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="addNewScene()">+ إضافة المشهد</button>
                            <button class="btn" style="background:#8b5cf6;" onclick="suggestAITrendingIdea()">🤖 💡 فكرة تريند من AI</button>
                        </div>
                    </div>
                </div>

                <!-- Scenes List -->
                <div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h2 style="margin: 0;">قائمة المشاهد (<span id="scenes-count">0</span>)</h2>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeAllScenes()">مسح الكل</button>
                        </div>
                        <div id="scenes-list">
                            <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">لا توجد مشاهد مضافة بعد. اكتب مشهدك الأول!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLAYER SECTION -->
        <div id="tab-player" class="hidden">
            <div class="player-container">
                <div style="margin-bottom: 10px; display: flex; gap: 8px;">
                    <button class="screen-ratio-btn" onclick="setAspectRatio('9/16')">📱 تيك توك وريلز (9:16)</button>
                    <button class="screen-ratio-btn" onclick="setAspectRatio('16/9')">💻 يوتيوب عريض (16:9)</button>
                </div>
                <div class="screen" id="main-screen">
                    <canvas id="cinema-canvas" width="720" height="1280"></canvas>
                    <div id="play-sub" class="subtitles">...</div>
                </div>

                <div class="controls">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-primary" id="play-btn" onclick="togglePlay()">تشغيل ▶️</button>
                        <button class="btn" style="background:#16a34a;" id="record-btn" onclick="toggleRecord()">🔴 تسجيل وتنزيل فيديو</button>
                        <button class="btn" onclick="prevScene()">السابق</button>
                        <button class="btn" onclick="nextScene()">التالي</button>
                    </div>
                    <div>
                        <select id="voice-lang" onchange="changeLang()" style="background:#0b0f19; color:#fff; border:1px solid #1e2d4a; padding:6px; border-radius:6px; font-size:0.8rem;">
                            <option value="ar-SA">الصوت: عربي 🇸🇦</option>
                            <option value="en-US">Voice: English 🇺🇸</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let scenes = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let currentLang = 'ar-SA';
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let animFrameId = null;
        let animProgress = 0;

        window.onload = function() {
            document.getElementById('scene-desc').value = "مشهد بانورامي لقلعة قديمة تطفو على جزيرة صخرية معلقة في الهواء...";
            document.getElementById('scene-text').value = "أيها المسافرون، لقد وصلتم إلى عتبة قلعة الأسرار. هنا، السحر ليس مجرد خرافة.";
            document.getElementById('scene-text-en').value = "Travelers, you have arrived at the threshold of the Castle of Secrets. Here, magic is real.";
        };

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const text = document.getElementById('scene-text').value.trim();
            const textEn = document.getElementById('scene-text-en').value.trim();
            const style = document.getElementById('scene-style').value;
            const duration = parseInt(document.getElementById('scene-duration').value) || 10;

            if (!desc) {
                alert("يرجى إدخال وصف المشهد!");
                return;
            }

            scenes.push({
                desc: desc,
                text: text || desc,
                textEn: textEn || text || desc,
                style: style,
                duration: duration
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-text').value = '';
            document.getElementById('scene-text-en').value = '';
            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">لا توجد مشاهد مضافة بعد. اكتب مشهدك الأول!</p>';
                return;
            }

            list.innerHTML = scenes.map((sc, i) => `
                <div class="scene-item">
                    <div class="scene-info">
                        <strong>مشهد #${i + 1} (${sc.duration} ثواني)</strong>
                        <p>${sc.desc}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteScene(index) {
            scenes.splice(index, 1);
            renderScenes();
        }

        function removeAllScenes() {
            scenes = [];
            renderScenes();
        }

        async function suggestAITrendingIdea() {
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "⏳ جاري الابتكار...";
            btn.disabled = true;

            const systemPrompt = "أنت مخرج ومؤلف فيديوهات تيك توك وريلز سينمائية رائجة. قم بتأليف مشهد واحد مشوق ومؤثر ومطلوب على السوشيال ميديا مدته 10 ثواني. أرجع الإجابة بتنسيق JSON فقط يحتوي على: style (إما space أو fantasy أو cyber أو nature), desc (وصف المشهد البصري بالعربي), text (الحوار/القصة بالعربي), textEn (ترجمة الحوار بالإنجليزي).";
            const userPrompt = "اقترح فكرة مشهد سينمائي تريند جديد وغريب يشد الانتباه في أول 3 ثواني.";

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    style: { type: "STRING" },
                                    desc: { type: "STRING" },
                                    text: { type: "STRING" },
                                    textEn: { type: "STRING" }
                                },
                                propertyOrdering: ["style", "desc", "text", "textEn"]
                            }
                        }
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    document.getElementById('scene-style').value = result.style || 'fantasy';
                    document.getElementById('scene-desc').value = result.desc;
                    document.getElementById('scene-text').value = result.text;
                    document.getElementById('scene-text-en').value = result.textEn;
                    document.getElementById('scene-duration').value = "10";
                }
            } catch (err) {
                const fallbackIdeas = [
                    { style: 'cyber', desc: "بوابة زمنية تنفتح وسط مدينة نيون، يخرج منها كائن مغطى بالذهب الضوئي", text: "في عام 2099، اكتشفنا أن المستقبل كان يراقبنا طوال الوقت.", textEn: "In 2099, we discovered the future was watching us all along." },
                    { style: 'fantasy', desc: "كتاب قديم يفتح تلقائياً وتخرج منه أضواء سحرية تمحو الظلام", text: "كل كلمة تكشف سرًا حُظر على البشر لآلاف السنين.", textEn: "Every word reveals a secret forbidden to humans for millennia." },
                    { style: 'space', desc: "رائد فضاء يلمس كريستالة ضخمة على كوكب مجهول فتبدأ بالاهتزاز", text: "لم تكن هذه الصخرة جماداً... بل كانت قلب الكوكب النباض.", textEn: "This rock wasn't dead... it was the planet's beating heart." }
                ];
                const item = fallbackIdeas[Math.floor(Math.random() * fallbackIdeas.length)];
                document.getElementById('scene-style').value = item.style;
                document.getElementById('scene-desc').value = item.desc;
                document.getElementById('scene-text').value = item.text;
                document.getElementById('scene-text-en').value = item.textEn;
                document.getElementById('scene-duration').value = "10";
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function setAspectRatio(ratio) {
            const screen = document.getElementById('main-screen');
            const canvas = document.getElementById('cinema-canvas');

            if (ratio === '16/9') {
                screen.classList.add('landscape');
                canvas.width = 1280;
                canvas.height = 720;
            } else {
                screen.classList.remove('landscape');
                canvas.width = 720;
                canvas.height = 1280;
            }
            if (scenes.length > 0) renderPlayerFrame();
        }

        function drawCinemaCanvas(sc) {
            const canvas = document.getElementById('cinema-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            animProgress += 0.005;

            // Gradient themes
            let grad;
            if (sc.style === 'space') {
                grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w);
                grad.addColorStop(0, '#1e1b4b');
                grad.addColorStop(0.5, '#0f172a');
                grad.addColorStop(1, '#020617');
            } else if (sc.style === 'cyber') {
                grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#831843');
                grad.addColorStop(0.5, '#311042');
                grad.addColorStop(1, '#0f172a');
            } else if (sc.style === 'nature') {
                grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#7c2d12');
                grad.addColorStop(0.5, '#365314');
                grad.addColorStop(1, '#064e3b');
            } else {
                grad = ctx.createRadialGradient(w/2, h/2, 100, w/2, h/2, w);
                grad.addColorStop(0, '#581c87');
                grad.addColorStop(0.6, '#1e1b4b');
                grad.addColorStop(1, '#0b0f19');
            }

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Animated particles / stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            for (let i = 0; i < 40; i++) {
                let x = (Math.sin(i * 99 + animProgress) * 0.5 + 0.5) * w;
                let y = (Math.cos(i * 33 + animProgress) * 0.5 + 0.5) * h;
                let size = (Math.sin(i + animProgress * 2) + 1.5) * 2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Cinematic title
            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('series-title').value || 'المسلسل القصير', w / 2, 80);

            // Scene Description text
            ctx.fillStyle = '#ffffff';
            ctx.font = '24px sans-serif';
            wrapText(ctx, sc.desc, w / 2, h / 2 - 40, w - 100, 34);

            if (isPlaying) {
                animFrameId = requestAnimationFrame(() => drawCinemaCanvas(sc));
            }
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        function startMovie() {
            currentIndex = 0;
            isPlaying = true;
            document.getElementById('play-btn').innerText = "إيقاف مؤقت ⏸️";
            runSceneSequence();
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                startMovie();
            }
        }

        function runSceneSequence() {
            if (!isPlaying) return;
            const sc = scenes[currentIndex];
            renderPlayerFrame();

            playTimer = setTimeout(() => {
                if (!isPlaying) return;
                if (currentIndex < scenes.length - 1) {
                    currentIndex++;
                    runSceneSequence();
                } else {
                    currentIndex = 0;
                    stopMovie();
                }
            }, sc.duration * 1000);
        }

        function renderPlayerFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];

            if (animFrameId) cancelAnimationFrame(animFrameId);
            drawCinemaCanvas(sc);

            const activeSub = (currentLang === 'en-US') ? sc.textEn : sc.text;
            document.getElementById('play-sub').innerText = activeSub;
            speak(activeSub);
        }

        function toggleRecord() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            if (scenes.length === 0) return;
            const canvas = document.getElementById('cinema-canvas');
            const stream = canvas.captureStream(30);

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `my-series-video-${Date.now()}.webm`;
                a.click();
                alert("تم تسجيل الفيديو بنجاح وتحميله على هاتفك! 📱🎉");
            };

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('record-btn').innerText = "⬛ جاري التسجيل (اضغط للإيقاف والتنزيل)";
            if (!isPlaying) togglePlay();
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('record-btn').innerText = "🔴 تسجيل وتنزيل فيديو";
            }
        }

        function stopMovie() {
            isPlaying = false;
            clearTimeout(playTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            document.getElementById('play-btn').innerText = "تشغيل ▶️";
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (isRecording) stopRecording();
        }

        function nextScene() {
            if (currentIndex < scenes.length - 1) {
                currentIndex++;
                renderPlayerFrame();
            }
        }

        function prevScene() {
            if (currentIndex > 0) {
                currentIndex--;
                renderPlayerFrame();
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = currentLang;
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
        }

        function changeLang() {
            currentLang = document.getElementById('voice-lang').value;
            if (scenes.length > 0) renderPlayerFrame();
        }

        function showTab(tab) {
            const editor = document.getElementById('tab-editor');
            const player = document.getElementById('tab-player');

            if (tab === 'editor') {
                editor.classList.remove('hidden');
                player.classList.add('hidden');
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("يرجى إضافة مشهد واحد على الأقل قبل العرض!");
                    return;
                }
                editor.classList.add('hidden');
                player.classList.remove('hidden');
                startMovie();
            }
        }
    </script>
</body>
</html>
