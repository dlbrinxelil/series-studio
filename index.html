</head>
<body>

    <header>
        <div class="logo-title">
            <h1>🎬 ستوديو المسلسلات القصيرة</h1>
            <p>صانع ومشغل القصص التفاعلي</p>
        </div>
        <div class="nav-btns">
            <button class="btn btn-primary" onclick="showTab('editor')">📝 الكتابة والسيناريو</button>
            <button class="btn" id="player-tab-btn" onclick="showTab('player')">▶️ عرض المسلسل</button>
        </div>
    </header>

    <main>
        <!-- EDITOR SECTION -->
        <div id="tab-editor">
            <div class="grid">
                <!-- Inputs -->
                <div>
                    <div class="card">
                        <h2>إعدادات القصة</h2>
                        <div class="form-group">
                            <label>عنوان الحلقة أو المسلسل</label>
                            <input type="text" id="series-title" value="مغامرة الفضاء المجهول">
                        </div>
                    </div>

                    <div class="card">
                        <h2>إضافة مشهد جديد</h2>
                        <div class="form-group">
                            <label>نوع رسم المشهد البصري (SVG Illustration Style)</label>
                            <select id="scene-style">
                                <option value="space">🚀 فضاء ومجرات واستكشاف</option>
                                <option value="fantasy">🏰 قلعة وفنتازيا وسحر</option>
                                <option value="cyber">🌆 مدينة مستقبلية ونيون</option>
                                <option value="nature">🌲 طبيعة وجبال وغروب</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>وصف المشهد البصري</label>
                            <textarea id="scene-desc" rows="2" placeholder="مثال: رائد فضاء يقف على كوكب غريب ملون..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>مدة المشهد (بالثواني)</label>
                            <input type="number" id="scene-duration" value="6" min="2" max="30">
                        </div>
                        <div class="form-group">
                            <label>النص أو الحوار بالعربي</label>
                            <textarea id="scene-text" rows="2" placeholder="مثال: مرحباً بكم في العالم الجديد..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>ترجمة الحوار بالإنجليزي (English text for narration)</label>
                            <textarea id="scene-text-en" rows="2" placeholder="Example: Welcome to the new world..."></textarea>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="addNewScene()">+ إضافة المشهد</button>
                            <button class="btn" onclick="suggestIdea()">💡 فكرة تلقائية</button>
                        </div>
                    </div>
                </div>

                <!-- Scenes List -->
                <div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h2 style="margin: 0;">قائمة المشاهد (<span id="scenes-count">0</span>)</h2>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeAllScenes()">مسح الكل</button>
                        </div>
                        <div id="scenes-list">
                            <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">لا توجد مشاهد مضافة بعد. اكتب مشهدك الأول!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLAYER SECTION -->
        <div id="tab-player" class="hidden">
            <div class="player-container">
                <div style="margin-bottom: 10px; display: flex; gap: 8px;">
                    <button class="screen-ratio-btn" onclick="setAspectRatio('9/16')">📱 تيك توك وريلز (9:16)</button>
                    <button class="screen-ratio-btn" onclick="setAspectRatio('16/9')">💻 يوتيوب عريض (16:9)</button>
                </div>
                <div class="screen" id="main-screen">
                    <canvas id="cinema-canvas" width="720" height="1280"></canvas>
                    <div id="play-sub" class="subtitles">...</div>
                </div>

                <div class="controls">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-primary" id="play-btn" onclick="togglePlay()">تشغيل ▶️</button>
                        <button class="btn" style="background:#16a34a;" id="record-btn" onclick="toggleRecord()">🔴 تسجيل وتنزيل فيديو</button>
                        <button class="btn" onclick="prevScene()">السابق</button>
                        <button class="btn" onclick="nextScene()">التالي</button>
                    </div>
                    <div>
                        <select id="voice-lang" onchange="changeLang()" style="background:#0b0f19; color:#fff; border:1px solid #1e2d4a; padding:6px; border-radius:6px; font-size:0.8rem;">
                            <option value="ar-SA">الصوت: عربي 🇸🇦</option>
                            <option value="en-US">Voice: English 🇺🇸</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let scenes = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let currentLang = 'ar-SA';
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let animFrameId = null;
        let animProgress = 0;

        const styleIcons = {
            space: `<path fill="#38bdf8" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>`,
            fantasy: `<path fill="#c084fc" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>`,
            cyber: `<path fill="#f43f5e" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>`,
            nature: `<path fill="#4ade80" d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C9.8 13.7 7 10 7 10l-6 8h22L14 6z"/>`
        };

        window.onload = function() {
            document.getElementById('scene-desc').value = "رحلة إلى كوكب مجهول في أعماق الفضاء";
            document.getElementById('scene-text').value = "وصلنا إلى الكوكب، وتبدأ المغامرة الآن لتكشف لنا أسرار الكون.";
            document.getElementById('scene-text-en').value = "We arrived at the planet, and the adventure begins now.";
        };

        function setAspectRatio(ratio) {
            const screen = document.getElementById('main-screen');
            const canvas = document.getElementById('cinema-canvas');
            screen.style.aspectRatio = ratio;
            if (ratio === '9/16') {
                canvas.width = 720;
                canvas.height = 1280;
            } else {
                canvas.width = 1280;
                canvas.height = 720;
            }
            renderPlayerFrame();
        }

        function drawAnimatedCanvas(sc, progress) {
            const canvas = document.getElementById('cinema-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Animated Zoom Effect
            const scale = 1 + progress * 0.08;
            ctx.save();
            ctx.translate(w / 2, h / 2);
            ctx.scale(scale, scale);
            ctx.translate(-w / 2, -h / 2);

            // Background Animated Gradient
            const grad = ctx.createLinearGradient(0, 0, w, h);
            if (sc.style === 'space') {
                grad.addColorStop(0, '#090d16');
                grad.addColorStop(0.5, '#1e1b4b');
                grad.addColorStop(1, '#311b92');
            } else if (sc.style === 'fantasy') {
                grad.addColorStop(0, '#2e1065');
                grad.addColorStop(0.5, '#581c87');
                grad.addColorStop(1, '#831843');
            } else if (sc.style === 'cyber') {
                grad.addColorStop(0, '#111827');
                grad.addColorStop(0.5, '#881337');
                grad.addColorStop(1, '#4c0519');
            } else {
                grad.addColorStop(0, '#064e3b');
                grad.addColorStop(0.5, '#047857');
                grad.addColorStop(1, '#022c22');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Floating Animated Particles / Stars
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 30; i++) {
                const x = (Math.sin(i * 99 + progress * 2) * 0.5 + 0.5) * w;
                const y = (Math.cos(i * 33 + progress * 2) * 0.5 + 0.5) * h;
                const size = (Math.sin(i + progress * 5) + 2) * 2;
                ctx.globalAlpha = Math.sin(i + progress * 3) * 0.4 + 0.5;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // Center Dynamic Illustration Badge
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.roundRect(w * 0.1, h * 0.25, w * 0.8, h * 0.4, 24);
            ctx.fill();

            // Text Banner
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${w > 800 ? '42px' : '32px'} system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(sc.desc.substring(0, 28), w / 2, h * 0.42);

            ctx.fillStyle = '#f43f5e';
            ctx.font = `${w > 800 ? '26px' : '20px'} system-ui, sans-serif`;
            ctx.fillText(`🎬 المشهد #${currentIndex + 1} (${sc.duration} ثوانٍ)`, w / 2, h * 0.52);

            ctx.restore();
        }

        function animateFrame() {
            if (!isPlaying && !isRecording) return;
            animProgress += 0.01;
            if (scenes.length > 0) {
                drawAnimatedCanvas(scenes[currentIndex], animProgress);
            }
            animFrameId = requestAnimationFrame(animateFrame);
        }

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const text = document.getElementById('scene-text').value.trim();
            const textEn = document.getElementById('scene-text-en').value.trim();
            const style = document.getElementById('scene-style').value;
            const duration = parseInt(document.getElementById('scene-duration').value) || 6;

            if (!desc) {
                alert("يرجى إدخال وصف المشهد!");
                return;
            }

            scenes.push({
                desc: desc,
                text: text || desc,
                textEn: textEn || text || desc,
                style: style,
                duration: duration
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-text').value = '';
            document.getElementById('scene-text-en').value = '';
            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;
            const totalDuration = scenes.reduce((acc, s) => acc + s.duration, 0);

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">لا توجد مشاهد مضافة بعد. اكتب مشهدك الأول!</p>';
                return;
            }

            list.innerHTML = `
                <div style="background:#1e293b; padding:8px 12px; border-radius:6px; font-size:0.8rem; margin-bottom:10px; color:#fef08a;">
                    ⏱️ مدة الفيديو الإجمالية: <strong>${totalDuration} ثانية</strong>
                </div>
            ` + scenes.map((sc, i) => `
                <div class="scene-item">
                    <div style="width:40px; height:40px; background:#1e293b; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.2rem;">
                        🎬
                    </div>
                    <div class="scene-info">
                        <strong>مشهد #${i + 1} (${sc.duration} ثانية)</strong>
                        <p>${sc.desc}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function startMovie() {
            currentIndex = 0;
            renderPlayerFrame();
        }

        function renderPlayerFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];

            animProgress = 0;
            drawAnimatedCanvas(sc, 0);

            const activeText = currentLang === 'en-US' ? sc.textEn : sc.text;
            document.getElementById('play-sub').innerText = activeText;
            speak(activeText);
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                isPlaying = true;
                document.getElementById('play-btn').innerText = "إيقاف مؤقت ⏸️";
                animateFrame();
                runSceneSequence();
            }
        }

        function runSceneSequence() {
            if (!isPlaying) return;
            const sc = scenes[currentIndex];
            renderPlayerFrame();

            playTimer = setTimeout(() => {
                if (!isPlaying) return;
                if (currentIndex < scenes.length - 1) {
                    currentIndex++;
                    runSceneSequence();
                } else {
                    currentIndex = 0;
                    stopMovie();
                }
            }, sc.duration * 1000);
        }

        function toggleRecord() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            if (scenes.length === 0) return;
            const canvas = document.getElementById('cinema-canvas');
            const stream = canvas.captureStream(30);

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = function(e) {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `my-series-video-${Date.now()}.webm`;
                a.click();
                alert("تم تسجيل الفيديو بنجاح وتحميله على هاتفك! 📱🎉");
            };

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('record-btn').innerText = "⬛ جاري التسجيل (اضغط للإيقاف والتنزيل)";
            if (!isPlaying) togglePlay();
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('record-btn').innerText = "🔴 تسجيل وتنزيل فيديو";
            }
        }

        function stopMovie() {
            isPlaying = false;
            clearTimeout(playTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            document.getElementById('play-btn').innerText = "تشغيل ▶️";
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (isRecording) stopRecording();
        }

        function showTab(tab) {
            const editor = document.getElementById('tab-editor');
            const player = document.getElementById('tab-player');

            if (tab === 'editor') {
                editor.classList.remove('hidden');
                player.classList.add('hidden');
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("يرجى إضافة مشهد واحد على الأقل قبل العرض!");
                    return;
                }
                editor.classList.add('hidden');
                player.classList.remove('hidden');
                startMovie();
            }
        }

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const text = document.getElementById('scene-text').value.trim();
            const textEn = document.getElementById('scene-text-en').value.trim();
            const seriesTitle = document.getElementById('series-title').value || "مسلسل قصير";

            if (!desc) {
                alert("يرجى إدخال وصف المشهد!");
                return;
            }

            const imgUrl = drawSceneCanvas(desc, seriesTitle, scenes.length);

            scenes.push({
                desc: desc,
                text: text || desc,
                textEn: textEn || text || desc,
                img: imgUrl
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-text').value = '';
            document.getElementById('scene-text-en').value = '';

            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">لا توجد مشاهد مضافة بعد. اكتب مشهدك الأول!</p>';
                return;
            }

            list.innerHTML = scenes.map((sc, i) => `
                <div class="scene-item">
                    <img src="${sc.img}" class="scene-img-canvas">
                    <div class="scene-info">
                        <strong>مشهد #${i + 1}</strong>
                        <p>${sc.desc}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteScene(index) {
            scenes.splice(index, 1);
            renderScenes();
        }

        function removeAllScenes() {
            scenes = [];
            renderScenes();
        }

        function suggestIdea() {
            const ideas = [
                { desc: "سفينة فضائية تعبر سحابة من النجوم الملونة", text: "تم تفعيل القفزة الضوئية باتجاه المجرة المجهولة.", textEn: "Warp drive engaged towards the unknown galaxy." },
                { desc: "قلعة قديمة فوق قمة جبل تحيط بها الغيوم والمطر", text: "أخيراً وصل الملك إلى القلعة المفقودة.", textEn: "Finally, the King arrived at the lost castle." },
                { desc: "مدينة مستقبلية مليئة بالإضاءات النيونية في منتصف الليل", text: "في هذه المدينة، كل شيء ممكن إذا كنت تملك المفتاح.", textEn: "In this city, everything is possible if you hold the key." }
            ];
            const random = ideas[Math.floor(Math.random() * ideas.length)];
            document.getElementById('scene-desc').value = random.desc;
            document.getElementById('scene-text').value = random.text;
            document.getElementById('scene-text-en').value = random.textEn;
        }

        function startMovie() {
            currentIndex = 0;
            renderPlayerFrame();
        }

        function renderPlayerFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];

            const canvas = document.getElementById('cinema-canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 800, 450);
            };
            img.src = sc.img;

            const activeText = currentLang === 'en-US' ? sc.textEn : sc.text;
            document.getElementById('play-sub').innerText = activeText;
            speak(activeText);
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                isPlaying = true;
                document.getElementById('play-btn').innerText = "إيقاف مؤقت ⏸️";
                playTimer = setInterval(() => {
                    if (currentIndex < scenes.length - 1) {
                        currentIndex++;
                        renderPlayerFrame();
                    } else {
                        currentIndex = 0;
                        renderPlayerFrame();
                    }
                }, 4500);
            }
        }

        function stopMovie() {
            isPlaying = false;
            clearInterval(playTimer);
            document.getElementById('play-btn').innerText = "تشغيل ▶️";
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function nextScene() {
            if (currentIndex < scenes.length - 1) {
                currentIndex++;
                renderPlayerFrame();
            }
        }

        function prevScene() {
            if (currentIndex > 0) {
                currentIndex--;
                renderPlayerFrame();
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = currentLang;
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
        }

        function changeLang() {
            currentLang = document.getElementById('voice-lang').value;
            renderPlayerFrame();
        }
    </script>
</body>
</html>
