<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Short Series Studio Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #151d2a;
            border-bottom: 1px solid #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-title h1 {
            font-size: 1.1rem;
            color: #f43f5e;
        }
        .logo-title p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #1e293b;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #e11d48;
        }
        .btn-primary:hover {
            background-color: #be123c;
        }

        main {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: #131b2e;
            border: 1px solid #1e2d4a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1rem;
            color: #f43f5e;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1e2d4a;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .scene-item {
            background-color: #0b0f19;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .scene-info {
            flex: 1;
            font-size: 0.8rem;
        }
        .scene-info strong {
            color: #f43f5e;
            display: block;
        }
        .scene-info p {
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .player-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 9/16;
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #e11d48;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.3);
        }
        .screen.landscape {
            max-width: 640px;
            aspect-ratio: 16/9;
        }

        .cinematic-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            animation: zoomEffect 20s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes zoomEffect {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .screen-ratio-btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .subtitles {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fef08a;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .scene-overlay-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
            z-index: 10;
            width: 90%;
            text-align: center;
        }

        .controls {
            width: 100%;
            background-color: #131b2e;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <h1>🎬 Cinematic Short Series Studio Pro</h1>
            <p>Moving Cinematic Backgrounds & Male Voiceover</p>
        </div>
        <div class="nav-btns">
            <button class="btn btn-primary" onclick="showTab('editor')">📝 Script Editor</button>
            <button class="btn" id="player-tab-btn" onclick="showTab('player')">▶️ Play Series</button>
        </div>
    </header>

    <main>
        <!-- EDITOR SECTION -->
        <div id="tab-editor">
            <div class="grid">
                <div>
                    <div class="card">
                        <h2>Series Settings</h2>
                        <div class="form-group">
                            <label>Series Title</label>
                            <input type="text" id="series-title" value="Epic Cinematic Shorts">
                        </div>
                        <div class="form-group">
                            <label>Voice Voiceover Tone</label>
                            <select id="voice-tone">
                                <option value="male">🎙️ Deep Male Voice (صوت ذكري عميق)</option>
                                <option value="female">🎙️ Female Voice (صوت أنثوي)</option>
                            </select>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Add Moving Cinematic Scene (30+ Secs)</h2>
                        <div class="form-group">
                            <label>Cinematic Moving Theme</label>
                            <select id="scene-theme">
                                <option value="space">🚀 Deep Space Warp & Moving Galaxies</option>
                                <option value="cyber">🌆 Cyberpunk City Chase & Neon Lights</option>
                                <option value="fantasy">🏰 Ancient Magical Floating Citadel</option>
                                <option value="nature">🌲 Mysterious Dark Forest & Mist</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Scene Title / Heading</label>
                            <textarea id="scene-desc" rows="2" placeholder="Scene heading..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Duration in Seconds (25-30s+ for long shorts)</label>
                            <input type="number" id="scene-duration" value="25" min="5" max="60">
                        </div>
                        <div class="form-group">
                            <label>🔊 Voiceover Text</label>
                            <textarea id="scene-spoken-text" rows="3" placeholder="Voice text..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>💬 Subtitle Text (Shown on Screen)</label>
                            <textarea id="scene-sub-text" rows="3" placeholder="Subtitles..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>🎵 Upload Custom Audio (Optional: MP3/WAV from your phone)</label>
                            <input type="file" id="custom-audio-file" accept="audio/*">
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="addNewScene()">+ Add Scene</button>
                            <button class="btn" style="background:#8b5cf6;" onclick="loadTrendingIdea()">💡 Ready Story Idea</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h2 style="margin: 0;">Scenes List (<span id="scenes-count">0</span>)</h2>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeAllScenes()">Clear All</button>
                        </div>
                        <div id="scenes-list">
                            <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PLAYER SECTION -->
        <div id="tab-player" class="hidden">
            <div class="player-container">
                <div style="margin-bottom: 10px; display: flex; gap: 8px;">
                    <button class="screen-ratio-btn" onclick="setAspectRatio('9/16')">📱 TikTok & Reels (9:16)</button>
                    <button class="screen-ratio-btn" onclick="setAspectRatio('16/9')">💻 YouTube Landscape (16:9)</button>
                </div>
                <div class="screen" id="main-screen">
                    <div id="cinematic-bg-layer" class="cinematic-bg"></div>
                    <div id="scene-title-overlay" class="scene-overlay-title"></div>
                    <div id="play-sub" class="subtitles">...</div>
                </div>

                <div class="controls">
                    <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                        <button class="btn btn-primary" id="play-btn" onclick="togglePlay()">Play ▶️</button>
                        <button class="btn" style="background:#16a34a;" id="record-btn" onclick="toggleRecord()">🔴 Record & Download</button>
                        <button class="btn" onclick="prevScene()">Prev</button>
                        <button class="btn" onclick="nextScene()">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let scenes = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;
        let currentAudioPlayer = null;

        const backgroundImages = {
            space: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop",
            cyber: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
            fantasy: "https://images.unsplash.com/photo-1514539079130-25950c84af65?q=80&w=1000&auto=format&fit=crop",
            nature: "https://images.unsplash.com/photo-1511497584788-8767611925b4?q=80&w=1000&auto=format&fit=crop"
        };

        const trendingIdeas = [
            {
                theme: "cyber",
                desc: "The Cyberpunk Runner's Escape",
                duration: 25,
                spokenText: "Running through the neon-lit alleys while corporate drones track every single move. There's no turning back now.",
                subText: "🏃‍♂️ Running for survival through the neon grid..."
            },
            {
                theme: "space",
                desc: "Journey Into The Unknown Galaxy",
                duration: 25,
                spokenText: "We crossed the event horizon into a parallel universe where time and space merge together.",
                subText: "🚀 Entering deep space wormhole..."
            },
            {
                theme: "fantasy",
                desc: "The Secrets of the Floating Citadel",
                duration: 25,
                spokenText: "High above the clouds, ancient magic awakens to choose its true guardian.",
                subText: "🏰 Unlocking ancient magical secrets..."
            }
        ];

        window.onload = function() {
            loadTrendingIdea();
        };

        function loadTrendingIdea() {
            const random = trendingIdeas[Math.floor(Math.random() * trendingIdeas.length)];
            document.getElementById('scene-theme').value = random.theme;
            document.getElementById('scene-desc').value = random.desc;
            document.getElementById('scene-duration').value = random.duration;
            document.getElementById('scene-spoken-text').value = random.spokenText;
            document.getElementById('scene-sub-text').value = random.subText;
        }

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const spokenText = document.getElementById('scene-spoken-text').value.trim();
            const subText = document.getElementById('scene-sub-text').value.trim();
            const theme = document.getElementById('scene-theme').value;
            const duration = parseInt(document.getElementById('scene-duration').value) || 25;
            const audioInput = document.getElementById('custom-audio-file');
            
            let audioUrl = null;
            if (audioInput.files && audioInput.files[0]) {
                audioUrl = URL.createObjectURL(audioInput.files[0]);
            }

            if (!desc) {
                alert("Please enter a scene description!");
                return;
            }

            scenes.push({
                desc: desc,
                spokenText: spokenText || desc,
                subText: subText || spokenText || desc,
                theme: theme,
                duration: duration,
                audioUrl: audioUrl
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-spoken-text').value = '';
            document.getElementById('scene-sub-text').value = '';
            audioInput.value = '';
            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>';
                return;
            }

            list.innerHTML = scenes.map((sc, i) => `
                <div class="scene-item">
                    <div class="scene-info">
                        <strong>Scene #${i + 1} (${sc.duration}s - ${sc.theme})</strong>
                        <p>${sc.desc} ${sc.audioUrl ? '🎵 (Custom Audio)' : ''}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteScene(index) {
            scenes.splice(index, 1);
            renderScenes();
        }

        function removeAllScenes() {
            scenes = [];
            renderScenes();
        }

        function setAspectRatio(ratio) {
            const screen = document.getElementById('main-screen');
            if (ratio === '16/9') {
                screen.classList.add('landscape');
            } else {
                screen.classList.remove('landscape');
            }
        }

        function startMovie() {
            currentIndex = 0;
            isPlaying = true;
            document.getElementById('play-btn').innerText = "Pause ⏸️";
            runScene();
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene to play!");
                    return;
                }
                startMovie();
            }
        }

        function runScene() {
            if (!isPlaying) return;
            const sc = scenes[currentIndex];
            renderFrame();

            playTimer = setTimeout(() => {
                if (!isPlaying) return;
                if (currentIndex < scenes.length - 1) {
                    currentIndex++;
                    runScene();
                } else {
                    currentIndex = 0;
                    stopMovie();
                }
            }, sc.duration * 1000);
        }

        function renderFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];
            const bgLayer = document.getElementById('cinematic-bg-layer');

            // Set Moving Cinematic Background Image
            bgLayer.style.backgroundImage = `url('${backgroundImages[sc.theme] || backgroundImages.space}')`;
            document.getElementById('scene-title-overlay').innerText = sc.desc;
            document.getElementById('play-sub').innerText = sc.subText;

            // Handle Audio (Custom file or speech synthesis with Male/Female tone)
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }

            if (sc.audioUrl) {
                currentAudioPlayer = new Audio(sc.audioUrl);
                currentAudioPlayer.play();
            } else {
                speak(sc.spokenText);
            }
        }

        function toggleRecord() {
            if (scenes.length === 0) {
                alert("Please add scenes before recording!");
                return;
            }
            alert("Starting playback for screen recording to export to TikTok/Reels!");
            startMovie();
        }

        function stopMovie() {
            isPlaying = false;
            clearTimeout(playTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (currentAudioPlayer) {
                currentAudioPlayer.pause();
                currentAudioPlayer = null;
            }
            document.getElementById('play-btn').innerText = "Play ▶️";
        }

        function nextScene() {
            if (currentIndex < scenes.length - 1) {
                currentIndex++;
                renderFrame();
            }
        }

        function prevScene() {
            if (currentIndex > 0) {
                currentIndex--;
                renderFrame();
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                const tone = document.getElementById('voice-tone').value;
                
                speech.rate = 0.9;
                speech.pitch = tone === 'male' ? 0.6 : 1.2; // Deep pitch for male voice
                
                window.speechSynthesis.speak(speech);
            }
        }

        function showTab(tab) {
            const editor = document.getElementById('tab-editor');
            const player = document.getElementById('tab-player');

            if (tab === 'editor') {
                editor.classList.remove('hidden');
                player.classList.add('hidden');
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene before playing!");
                    return;
                }
                editor.classList.add('hidden');
                player.classList.remove('hidden');
                startMovie();
            }
        }
    </script>
</body>
</html>
