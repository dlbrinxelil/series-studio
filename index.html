<body>

    <header>
        <div class="logo-title">
            <h1>🎬 Cinematic 3D Shorts Pro</h1>
            <p>Advanced 3D WebGL Engine & Deep Voice Over</p>
        </div>
        <div class="nav-btns">
            <button class="btn btn-primary" onclick="showTab('editor')">📝 Script Editor</button>
            <button class="btn" id="player-tab-btn" onclick="showTab('player')">▶️ Play 3D Movie</button>
        </div>
    </header>

    <main>
        <!-- EDITOR SECTION -->
        <div id="tab-editor">
            <div class="grid">
                <div>
                    <div class="card">
                        <h2>Series Settings</h2>
                        <div class="form-group">
                            <label>Series Title</label>
                            <input type="text" id="series-title" value="Pro 3D Cinematic Story">
                        </div>
                    </div>

                    <div class="card">
                        <h2>Add 3D Pro Scene (30+ Secs)</h2>
                        <div class="form-group">
                            <label>3D Pro Environment</label>
                            <select id="scene-theme">
                                <option value="space">🚀 3D Deep Space Warp & Rings Galaxy</option>
                                <option value="cyber">🌆 3D Cyberpunk Matrix Grid & Neon Towers</option>
                                <option value="fantasy">🏰 3D Magical Floating Floating Citadel</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Scene Title</label>
                            <textarea id="scene-desc" rows="2" placeholder="Scene title..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Duration in Seconds (25-30s+)</label>
                            <input type="number" id="scene-duration" value="25" min="5" max="60">
                        </div>
                        <div class="form-group">

                            <textarea id="scene-spoken-text" rows="3" placeholder="Voice text in English..."></textarea>
                        </div>

                            <label>💬 Subtitle Text (Shown on Screen)</label>

                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="width: 100%;" onclick="addNewScene()">+ Add 3D Pro Scene</button>
                            <button class="btn" style="background:#8b5cf6;" onclick="loadTrendingIdea()">💡 Pro Story Idea</button>
                        </div>

                    <div class="card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <h2 style="margin: 0;">Scenes List (<span id="scenes-count">0</span>)</h2>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeAllScenes()">Clear All</button>
                        </div>
                        <div id="scenes-list">
                            <p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>

    </main>

    <script>
        let scenes = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;

        // Three.js Pro Variables
        let scene3D, camera3D, renderer3D, anim3DId;
        let meshGroup = new THREE.Group();

        const trendingIdeas = [
            {
                theme: "cyber",
                desc: "The Cyberpunk Matrix Overdrive",
                duration: 25,
                spokenText: "Navigating through the high-security quantum cyber grid where digital towers pulse with rogue energy.",
                subText: "Navigating through the quantum cyber grid..."
            },
            {
                theme: "space",
                desc: "Deep Space Superluminal Jump",
                duration: 25,
                spokenText: "Warp speed engaged across rotating 3D planetary rings into an unknown alternate dimension.",
                subText: "Warp speed engaged. Entering alternate dimension..."
            },
            {
                theme: "fantasy",
                desc: "Awakening the Floating Crystal Citadel",
                duration: 25,
                spokenText: "High above the stormy clouds, ancient magical structures resonate with supreme cosmic power.",
                subText: "Ancient magical structures awakening..."
            }
        ];

        window.onload = function() {
            init3DProEngine();
            loadTrendingIdea();
        };

        function init3DProEngine() {
            const canvas = document.getElementById('three-canvas');
            renderer3D = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer3D.setSize(380, 675);
            renderer3D.setPixelRatio(window.devicePixelRatio);

            scene3D = new THREE.Scene();
            camera3D = new THREE.PerspectiveCamera(60, 380 / 675, 0.1, 1000);
            camera3D.position.z = 12;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene3D.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xf43f5e, 2.5);
            dirLight.position.set(5, 12, 8);
            scene3D.add(dirLight);

            scene3D.add(meshGroup);
        }

        function build3DProWorld(theme) {
            while(meshGroup.children.length > 0) {
                meshGroup.remove(meshGroup.children[0]);
            }

            if (theme === 'space') {
                scene3D.background = new THREE.Color(0x020617);
                const pGeo = new THREE.SphereGeometry(3.2, 32, 32);
                const pMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.2, metalness: 0.5 });
                const planet = new THREE.Mesh(pGeo, pMat);
                meshGroup.add(planet);

                const ringGeo = new THREE.RingGeometry(4.5, 6.2, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.5;
                planet.add(ring);

            } else if (theme === 'cyber') {
                scene3D.background = new THREE.Color(0x030712);
                for(let i = -3; i <= 3; i += 1.5) {
                    const cGeo = new THREE.BoxGeometry(1.2, Math.random() * 8 + 3, 1.2);
                    const cMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, wireframe: true, emissive: 0x0891b2 });
                    const col = new THREE.Mesh(cGeo, cMat);
                    col.position.set(i * 1.6, -1.5, Math.random() * -3);
                    meshGroup.add(col);
                }

            } else if (theme === 'fantasy') {
                scene3D.background = new THREE.Color(0x1e1b4b);
                const cGeo = new THREE.CylinderGeometry(1.2, 1.8, 4, 16);
                const cMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.3, metalness: 0.6 });
                const castle = new THREE.Mesh(cGeo, cMat);
                meshGroup.add(castle);

                for(let i = 0; i < 6; i++) {
                    const oGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const oMat = new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0x9333ea });
                    const orb = new THREE.Mesh(oGeo, oMat);
                    orb.position.set(Math.sin(i) * 3.8, Math.cos(i) * 2.2, Math.sin(i * 2) * 2);
                    meshGroup.add(orb);
                }
            }
        }

        function animate3DPro() {
            if (!isPlaying) return;
            anim3DId = requestAnimationFrame(animate3DPro);

            meshGroup.rotation.y += 0.012;
            meshGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.12;
            camera3D.position.z = 10 + Math.sin(Date.now() * 0.002) * 1.2;

            renderer3D.render(scene3D, camera3D);
        }

        function loadTrendingIdea() {
            const random = trendingIdeas[Math.floor(Math.random() * trendingIdeas.length)];
            document.getElementById('scene-theme').value = random.theme;
            document.getElementById('scene-desc').value = random.desc;
            document.getElementById('scene-duration').value = random.duration;
            document.getElementById('scene-spoken-text').value = random.spokenText;
            document.getElementById('scene-sub-text').value = random.subText;
        }

        function addNewScene() {
            const desc = document.getElementById('scene-desc').value.trim();
            const spokenText = document.getElementById('scene-spoken-text').value.trim();
            const subText = document.getElementById('scene-sub-text').value.trim();
            const theme = document.getElementById('scene-theme').value;
            const duration = parseInt(document.getElementById('scene-duration').value) || 25;

            if (!desc) {
                alert("Please enter a scene description!");
                return;
            }

            scenes.push({
                desc: desc,
                spokenText: spokenText || desc,
                subText: subText || spokenText || desc,
                theme: theme,
                duration: duration
            });

            document.getElementById('scene-desc').value = '';
            document.getElementById('scene-spoken-text').value = '';
            document.getElementById('scene-sub-text').value = '';
            renderScenes();
        }

        function renderScenes() {
            const list = document.getElementById('scenes-list');
            document.getElementById('scenes-count').innerText = scenes.length;

            if (scenes.length === 0) {
                list.innerHTML = '<p style="font-size: 0.8rem; color: #64748b; text-align: center; padding: 20px;">No scenes added yet!</p>';
                return;
            }

            list.innerHTML = scenes.map((sc, i) => `
                <div class="scene-item">
                    <div class="scene-info">
                        <strong>3D Pro Scene #${i + 1} (${sc.duration}s - ${sc.theme})</strong>
                        <p>${sc.desc}</p>
                    </div>
                    <button class="btn" style="background: transparent; color: #f43f5e;" onclick="deleteScene(${i})">🗑️</button>
                </div>
            `).join('');
        }

        function deleteScene(index) {
            scenes.splice(index, 1);
            renderScenes();
        }

        function removeAllScenes() {
            scenes = [];
            renderScenes();
        }

        function setAspectRatio(ratio) {
            const screen = document.getElementById('main-screen');
            const w = ratio === '16/9' ? 640 : 380;
            const h = ratio === '16/9' ? 360 : 675;

            if (ratio === '16/9') {
                screen.classList.add('landscape');
            } else {
                screen.classList.remove('landscape');
            }

            renderer3D.setSize(w, h);
            camera3D.aspect = w / h;
            camera3D.updateProjectionMatrix();
        }

        function startMovie() {
            currentIndex = 0;
            isPlaying = true;
            document.getElementById('play-btn').innerText = "Pause ⏸️";
            runScene();
        }

        function togglePlay() {
            if (isPlaying) {
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene to play!");
                    return;
                }
                startMovie();
            }
        }

        function runScene() {
            if (!isPlaying) return;
            const sc = scenes[currentIndex];
            renderFrame();

            playTimer = setTimeout(() => {
                if (!isPlaying) return;
                if (currentIndex < scenes.length - 1) {
                    currentIndex++;
                    runScene();
                } else {
                    currentIndex = 0;
                    stopMovie();
                }
            }, sc.duration * 1000);
        }

        function renderFrame() {
            if (scenes.length === 0) return;
            const sc = scenes[currentIndex];

            document.getElementById('scene-title-overlay').innerText = sc.desc;
            document.getElementById('play-sub').innerText = sc.subText;

            build3DProWorld(sc.theme);
            if (anim3DId) cancelAnimationFrame(anim3DId);
            animate3DPro();

            speakProDeepMale(sc.spokenText);
        }

        function toggleRecord() {
            if (scenes.length === 0) {
                alert("Please add scenes before recording!");
                return;
            }
            alert("Starting 3D Pro playback for screen recording to export to TikTok/Reels!");
            startMovie();
        }

        function stopMovie() {
            isPlaying = false;
            clearTimeout(playTimer);
            if (anim3DId) cancelAnimationFrame(anim3DId);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('play-btn').innerText = "Play 3D Pro ▶️";
        }

        function nextScene() {
            if (currentIndex < scenes.length - 1) {
                currentIndex++;
                renderFrame();
            }
        }

        function prevScene() {
            if (currentIndex > 0) {
                currentIndex--;
                renderFrame();
            }
        }

        function speakProDeepMale(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 0.88;
                speech.pitch = 0.05; // Maximum deep male pitch
                
                const voices = window.speechSynthesis.getVoices();
                const bestVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Male')));
                if (bestVoice) speech.voice = bestVoice;

                window.speechSynthesis.speak(speech);
            }
        }

        function showTab(tab) {
            const editor = document.getElementById('tab-editor');
            const player = document.getElementById('tab-player');

            if (tab === 'editor') {
                editor.classList.remove('hidden');
                player.classList.add('hidden');
                stopMovie();
            } else {
                if (scenes.length === 0) {
                    alert("Please add at least one scene before playing!");
                    return;
                }
                editor.classList.add('hidden');
                player.classList.remove('hidden');
                startMovie();
            }
        }
    </script>
</body>
</html>
